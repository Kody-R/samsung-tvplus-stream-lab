<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Samsung TV Plus Stream Lab</title>
  <desc id="desc">A dark rounded-square app icon with a television screen, streaming waveform, and laboratory flask motif.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="screen" x1="138" y1="150" x2="376" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="liquid" x1="279" y1="299" x2="363" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="108" y="126" width="296" height="210" rx="30"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#334155" stroke-width="3" opacity="0.75"/>

  <rect x="92" y="110" width="328" height="242" rx="42" fill="#0F172A" stroke="#E2E8F0" stroke-width="12"/>
  <rect x="108" y="126" width="296" height="210" rx="30" fill="url(#screen)"/>

  <g clip-path="url(#screenClip)" filter="url(#glow)">
    <path d="M88 250
             C118 250 122 206 150 206
             C180 206 178 286 210 286
             C240 286 246 188 278 188
             C309 188 312 273 340 273
             C370 273 378 228 424 228"
          fill="none" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M206 352 L188 390" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round"/>
  <path d="M306 352 L324 390" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round"/>
  <path d="M166 398 H346" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round"/>

  <g>
    <path d="M316 286
             V330
             L274 397
             C262 416 275 438 298 438
             H394
             C417 438 430 416 418 397
             L376 330
             V286"
          fill="#0F172A" stroke="#F8FAFC" stroke-width="12" stroke-linejoin="round"/>
    <path d="M306 286 H386" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round"/>

    <path d="M294 390
             C320 372 342 400 365 385
             C381 375 396 384 406 398
             L413 410
             C419 420 412 428 398 428
             H294
             C281 428 274 416 281 405
             Z"
          fill="url(#liquid)"/>

    <circle cx="339" cy="365" r="9" fill="#67E8F9"/>
    <circle cx="374" cy="405" r="7" fill="#C084FC"/>
    <circle cx="309" cy="407" r="6" fill="#A5F3FC"/>
  </g>

  <circle cx="382" cy="328" r="9" fill="#22C55E" stroke="#DCFCE7" stroke-width="4"/>
</svg>
