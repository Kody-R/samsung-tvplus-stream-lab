name: samsung-tvplus-stream-lab

services:
  samsung-stream-lab:
    image: ghcr.io/kody-r/samsung-tvplus-stream-lab:latest
    pull_policy: always
    container_name: samsung-stream-lab
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TZ: America/Chicago
    volumes:
      - /DATA/AppData/samsung-tvplus-stream-lab/data:/app/data

x-casaos:
  id: com.github.kody-r.samsung-tvplus-stream-lab
  main: samsung-stream-lab
  index: /
  port_map: "8091"
  scheme: http
  title:
    en_US: Samsung TV Plus Stream Lab
  tagline:
    en_US: Diagnostic and stabilization proxy for Samsung TV Plus and FAST HLS streams.
  description:
    en_US: Import full M3U/XMLTV sources, select the channels you want, and route selected FAST/SSAI streams through Stream Lab stabilization before Jellyfin.
  icon: https://raw.githubusercontent.com/Kody-R/samsung-tvplus-stream-lab/main/samsung-tvplus-stream-lab-icon.svg
  author: Kody-R
  developer: Kody-R
  category: Media
  architectures:
    - amd64
  version: "0.2.3"
  update_at: "2026-08-17"
  repo: https://github.com/Kody-R/samsung-tvplus-stream-lab
  website: https://github.com/Kody-R/samsung-tvplus-stream-lab
  support: https://github.com/Kody-R/samsung-tvplus-stream-lab/issues
