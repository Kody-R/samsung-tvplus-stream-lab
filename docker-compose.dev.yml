services:
  samsung-stream-lab:
    build:
      context: .
      args:
        VERSION: 0.1.2
    image: samsung-tvplus-stream-lab:0.1.2
    container_name: samsung-stream-lab
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TZ: America/Chicago
    volumes:
      - ./data:/app/data
